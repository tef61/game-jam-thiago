<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Game Controller</title>
  <link rel="stylesheet" href="engine.css">
  <link rel="stylesheet" href="game.css">
</head>
<body class="phone-page">

  <!-- The join form (room code + name). The engine fills it in. Keep it. -->
  <section id="join-form"></section>

  <!-- YOUR GAME'S CONTROLLER. Shown after the player joins.
       play-game.js builds the controls in here. Change freely,
       but keep the #phone and #me-tag elements. -->
  <section id="phone" style="display:none">
    <header class="phone-top"><span id="me-tag"></span></header>
    <div id="controls"></div>
  </section>

  <!-- Script order matters. Keep these four lines in this order. -->
  <script src="lib/supabase.js"></script>
  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script src="play-game.js"></script>
</body>
</html>
